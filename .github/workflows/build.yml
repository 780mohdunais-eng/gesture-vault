name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o GestureVault.zip
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: chmod +x GestureVault/gradlew || true
      - run: cd GestureVault && gradle wrapper --gradle-version 8.4
      - run: cd GestureVault && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: GestureVault/app/build/outputs/apk/debug/app-debug.apk
